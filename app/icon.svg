<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="nbsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#nbsGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="102" fill="none" stroke="#ef4444" stroke-width="8" stroke-opacity="0.4"/>

  <!-- Inner Truck/Arrow Chevron Accent -->
  <path d="M70 420 L442 420" stroke="#f0ece3" stroke-width="14" stroke-linecap="round" stroke-opacity="0.25"/>
  <circle cx="442" cy="420" r="10" fill="#f0ece3" fill-opacity="0.8"/>

  <!-- Bold NBS Monogram Text -->
  <text 
    x="50%" 
    y="56%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#f0ece3" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="900" 
    font-size="192" 
    letter-spacing="-6"
    filter="url(#subtleShadow)">NBS</text>
  
  <!-- Subtitle / Tagline FREIGHT -->
  <text 
    x="50%" 
    y="78%" 
    text-anchor="middle" 
    dominant-baseline="central" 
    fill="#f0ece3" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
    font-weight="800" 
    font-size="44" 
    letter-spacing="14"
    fill-opacity="0.9">FREIGHT</text>
</svg>
